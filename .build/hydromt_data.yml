meta:
  root: None

chelsa:
  uri: meteo/chelsa_clim_v1.2/CHELSA_bio10_12.tif
  driver:
    options:
      chunks:
        x: 3600
        y: 3600
    name: rasterio
  version: '1.2'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -90.0
        East: 180.0
        North: 84.0
    category: meteo
    paper_doi: 10.1038/sdata.2017.122
    paper_ref: Karger et al. (2017)
    url: http://chelsa-climate.org/downloads/
    license: CC BY 4.0
  data_type: RasterDataset
  root: None

grdc:
  uri: hydro/grdc/GRDC_Stations.csv
  data_adapter:
    rename:
      area: uparea
  driver:
    options:
      index_col: grdc_no
    name: geodataframe_table
  metadata:
    crs: 4326
    category: observed data
    notes: GRDC-Station Catalogue, last downloaded 2020-07-16
    url: https://portal.grdc.bafg.de/applications/public.html?publicuser=PublicUser#dataDownload/StationCatalogue
    license: https://www.bafg.de/GRDC/EN/02_srvcs/21_tmsrs/210_prtl/tou.html;jsessionid=A56D50D4A36D3D8707CBF00CBD71F106.live11291?nn=2862854
  data_type: GeoDataFrame
  root: None

hydro_lakes:
  uri: hydrography/lakes/lake-db.fgb
  data_adapter:
    unit_mult:
      Area_avg: 1000000.0
    rename:
      Depth_avg: Depth_avg
      Dis_avg: Dis_avg
      Hylak_id: waterbody_id
      Lake_area: Area_avg
      Pour_lat: yout
      Pour_long: xout
      Vol_total: Vol_avg
  driver:
    name: pyogrio
  version: '1.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -55.865
        East: 180.0
        North: 83.576
    category: surface water
    processing_notes: extract of hydrolakes to only include natural lakes and exclude
      reservoirs and control lakes (ie filter on Lake_type = 1)
    author: HydroSHEDS
  data_type: GeoDataFrame
  root: None

hydro_reservoirs:
  uri: hydrography/reservoirs/reservoir-db.fgb
  data_adapter:
    unit_mult:
      Area_avg: 1000000.0
      Capacity_max: 1000000.0
      Capacity_min: 1000000.0
      Capacity_norm: 1000000.0
      Vol_avg: 1000000.0
    rename:
      Depth_avg: Depth_avg
      Dis_avg: Dis_avg
      G_CAP_MAX: Capacity_max
      G_CAP_MIN: Capacity_min
      G_CAP_REP: Capacity_norm
      G_DAM_HGT_: Dam_height
      Grand_id: waterbody_id
      Hylak_id: Hylak_id
      Lake_area: Area_avg
      Pour_lat: yout
      Pour_long: xout
      Vol_total: Vol_avg
  driver:
    name: pyogrio
  version: '1.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -153.059
        South: -45.881
        East: 176.825
        North: 70.396
    nodata: -99
    category: surface water
    notes: GRanD.v1.1_HydroLAKES.v10_JRC.2016
    processing_notes: combined not natural lakes from HydroLAKES v10 (Lake_type !=
      1) with reservoirs attributes from GRanD v1.1
    author: Alessia Matano
  data_type: GeoDataFrame
  root: None

koppen_geiger:
  uri: meteo/climate_classification_v2017/Map_KG-Global.tif
  driver:
    options:
      chunks:
        x: 3600
        y: 3600
    name: rasterio
  version: '2017'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -90.0
        East: 180.0
        North: 90.0
    nodata: 0
    category: meteo
    paper_doi: 10.1127/0941-2948/2006/0130
    paper_ref: Kottek et al. (2006)
    url: http://koeppen-geiger.vu-wien.ac.at/present.htm
  data_type: RasterDataset
  root: None

ksathorfrac:
  uri: soil/ksathorfrac.zarr
  driver:
    options:
      chunks:
        lon: 2400
        lat: 2400
    name: raster_xarray
  metadata:
    crs: 4326
    resolution: 250 metres
  data_type: RasterDataset
  root: None

merit_hydro:
  uri: topography/merit_hydro/*.vrt
  data_adapter:
    rename:
      bas: basins
      dir: flwdir
      elv: elevtn
      slp: lndslp
      sto: strord
      upa: uparea
      upg: upgrid
      wth: rivwth
  driver:
    options:
      chunks:
        x: 6000
        y: 6000
    name: rasterio
  version: '1.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -60.0
        East: 180.0
        North: 85.0
    category: topography
    paper_doi: 10.1029/2019WR024873
    paper_ref: Yamazaki et al. (2019)
    processing_notes: create vrt file with gdalbuildvrt; additional variables for
      stream-order, basin index (basins), and slope (lndslp) derived with pyflwdir
    url: http://hydro.iis.u-tokyo.ac.jp/~yamadai/MERIT_Hydro
    license: CC-BY-NC 4.0 or ODbL 1.0
  data_type: RasterDataset
  root: None

merit_hydro_index:
  uri: topography/merit_hydro/basin_index.fgb
  driver:
    name: pyogrio
  version: '1.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.028
        South: -59.46
        East: 190.338
        North: 83.661
    category: topography
    paper_doi: 10.5194/hess-25-5287-2021
    paper_ref: Eilander et al. (2021)
    license: CC-BY-NC 4.0
  data_type: GeoDataFrame
  root: None

modis_lai:
  uri: landuse/modis/MODIS_MCD15A3H_LAI/*.tif
  data_adapter:
    unit_mult:
      LAI: 0.1
  driver:
    options:
      chunks:
        x: 3600
        y: 3600
      concat: true
    name: rasterio
  version: '6'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.004
        South: -90.002
        East: 180.004
        North: 90.002
    category: landuse
    paper_doi: 10.5067/MODIS/MCD15A3H.006
    paper_ref: Myneni et al (2015)
    processing_notes: this dataset has been extracted from GEE ('MODIS/006/MCD15A3H')
      for the period '2003-01-01', '2017-12-31'
    processing_script:
      GEE_script: landuse/modis/MODIS_MCD15A3H_LAI/GEE_MODIS_LAI.js
      merge_script: landuse/modis/MODIS_MCD15A3H_LAI/merge_rasters_GEE_LAI.py
    url: https://lpdaac.usgs.gov/products/mcd15a3hv006/
    license: https://lpdaac.usgs.gov/data/data-citation-and-policies/
  data_type: RasterDataset
  root: None

rgi:
  uri: hydrography/rgi/rgi.fgb
  data_adapter:
    rename:
      C3S_ID: C3S_id
      GLIMSID: GLIMS_id
      ID: simple_id
      RGIID: RGI_id
  driver:
    name: pyogrio
  version: '6.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -179.921
        South: -78.309
        East: 179.751
        North: 83.608
    category: surface water
    notes: Randolph Glacier Inventory
    paper_doi: 10.3189/2014JoG13J176
    paper_ref: Pfeffer et al. (2014)
    url: https://cds.climate.copernicus.eu/cdsapp#!/dataset/insitu-glaciers-extent?tab=overview
    license: CC BY 4.0
  data_type: GeoDataFrame
  root: None

roughness_river_mapping_default:
  uri: wflow_sbm/river_manning_mapping.csv
  driver:
    options:
      index_col: 0
      dtype:
        river_manning_n: float32
    name: pandas
  version: '1.0'
  metadata:
    category: hydrography
    info: Mapping between streamorder and river Manning roughness
  data_type: DataFrame
  root: None

soilgrids:
  uri: soil/soilgrids_v1.0/*_250m_ll.tif
  data_adapter:
    unit_mult:
      bd_sl1: 0.001
      bd_sl2: 0.001
      bd_sl3: 0.001
      bd_sl4: 0.001
      bd_sl5: 0.001
      bd_sl6: 0.001
      bd_sl7: 0.001
      oc_sl1: 0.1
      oc_sl2: 0.1
      oc_sl3: 0.1
      oc_sl4: 0.1
      oc_sl5: 0.1
      oc_sl6: 0.1
      oc_sl7: 0.1
      ph_sl1: 0.1
      ph_sl2: 0.1
      ph_sl3: 0.1
      ph_sl4: 0.1
      ph_sl5: 0.1
      ph_sl6: 0.1
      ph_sl7: 0.1
    rename:
      BLDFIE_M_sl1_250m_ll: bd_sl1
      BLDFIE_M_sl2_250m_ll: bd_sl2
      BLDFIE_M_sl3_250m_ll: bd_sl3
      BLDFIE_M_sl4_250m_ll: bd_sl4
      BLDFIE_M_sl5_250m_ll: bd_sl5
      BLDFIE_M_sl6_250m_ll: bd_sl6
      BLDFIE_M_sl7_250m_ll: bd_sl7
      CLYPPT_M_sl1_250m_ll: clyppt_sl1
      CLYPPT_M_sl2_250m_ll: clyppt_sl2
      CLYPPT_M_sl3_250m_ll: clyppt_sl3
      CLYPPT_M_sl4_250m_ll: clyppt_sl4
      CLYPPT_M_sl5_250m_ll: clyppt_sl5
      CLYPPT_M_sl6_250m_ll: clyppt_sl6
      CLYPPT_M_sl7_250m_ll: clyppt_sl7
      ORCDRC_M_sl1_250m_ll: oc_sl1
      ORCDRC_M_sl2_250m_ll: oc_sl2
      ORCDRC_M_sl3_250m_ll: oc_sl3
      ORCDRC_M_sl4_250m_ll: oc_sl4
      ORCDRC_M_sl5_250m_ll: oc_sl5
      ORCDRC_M_sl6_250m_ll: oc_sl6
      ORCDRC_M_sl7_250m_ll: oc_sl7
      PHIHOX_M_sl1_250m_ll: ph_sl1
      PHIHOX_M_sl2_250m_ll: ph_sl2
      PHIHOX_M_sl3_250m_ll: ph_sl3
      PHIHOX_M_sl4_250m_ll: ph_sl4
      PHIHOX_M_sl5_250m_ll: ph_sl5
      PHIHOX_M_sl6_250m_ll: ph_sl6
      PHIHOX_M_sl7_250m_ll: ph_sl7
      SLTPPT_M_sl1_250m_ll: sltppt_sl1
      SLTPPT_M_sl2_250m_ll: sltppt_sl2
      SLTPPT_M_sl3_250m_ll: sltppt_sl3
      SLTPPT_M_sl4_250m_ll: sltppt_sl4
      SLTPPT_M_sl5_250m_ll: sltppt_sl5
      SLTPPT_M_sl6_250m_ll: sltppt_sl6
      SLTPPT_M_sl7_250m_ll: sltppt_sl7
      SNDPPT_M_sl1_250m_ll: sndppt_sl1
      SNDPPT_M_sl2_250m_ll: sndppt_sl2
      SNDPPT_M_sl3_250m_ll: sndppt_sl3
      SNDPPT_M_sl4_250m_ll: sndppt_sl4
      SNDPPT_M_sl5_250m_ll: sndppt_sl5
      SNDPPT_M_sl6_250m_ll: sndppt_sl6
      SNDPPT_M_sl7_250m_ll: sndppt_sl7
      SoilThickness_250m_ll: soilthickness
      TAXOUSDA_250m_ll: tax_usda
  driver:
    options:
      chunks:
        x: 2400
        y: 2400
    name: rasterio
  version: '1.0'
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -90.0
        East: 180.0
        North: 90.0
    category: soil
    notes: "soilthickness is based on 1) soilgrids (global) and 2) dataset for Eurasia\
      \ (ESDAC, 2004; Panagos et al., 2012): ESDAC, 2004. The european soil database\
      \ distribution version 2.0, european commission and the European soil bureau\n\
      \ network.  esdac.jrc.ec.europa.eu, accessed: 2017-11-17.  Panagos, P., Van\
      \ Liedekerke, M., Jones, A., Montanarella, L., 2012. European soil data centre:\
      \ Response to european policy support  and public data requirements. Land Use\
      \ Policy 29 (2), 329\xE2\u20AC\u201C338. \n"
    paper_doi: 10.1371/journal.pone.0169748
    paper_ref: Hengl et al. (2017)
    processing_notes: soilthickness is based on 1) soilgrids (global, depth to bedrock
      - BDRICM variable) and 2) dataset for Eurasia
    processing_script: p:/wflow_global/static_data/wflow_sbm_parameters/
    url: https://www.isric.org/explore/soilgrids/faq-soilgrids-201
    license: ODbL
  data_type: RasterDataset
  root: None

vito_2018:
  uri: landuse/vito/PROBAV_LC100_global_v3.0.1_2018-conso_Discrete-Classification-map_EPSG-4326.tif
  driver:
    options:
      chunks:
        x: 3600
        y: 3600
    name: rasterio
  version: 3.0.1
  metadata:
    crs: 4326
    extent:
      bbox:
        West: -180.0
        South: -60.0
        East: 180.0
        North: 80.0
    category: landuse
    paper_doi: 10.5281/zenodo.3518038
    paper_ref: Buchhorn et al (2020)
    url: https://land.copernicus.eu/global/products/lc
  data_type: RasterDataset
  root: None

vito_mapping_default:
  uri: lulc/v1.0/vito_mapping.csv
  driver:
    options:
      index_col: 0
      dtype:
        landuse: int16
        vegetation_kext: float32
        land_manning_n: float32
        soil_compacted_fraction: float32
        vegetation_root_depth: float32
        vegetation_leaf_storage: float32
        vegetation_wood_storage: float32
        land_water_fraction: float32
        vegetation_crop_factor: float32
        vegetation_feddes_alpha_h1: int16
        vegetation_feddes_h1: int16
        vegetation_feddes_h2: int16
        vegetation_feddes_h3_high: int16
        vegetation_feddes_h3_low: int16
        vegetation_feddes_h4: int16
        erosion_usle_c: float32
        Cov_River: float32
    name: pandas
  version: '1.0'
  metadata:
    category: landuse
    info: landuse parameters based on vito classification (https://land.copernicus.eu/global/products/lc)
  data_type: DataFrame
  root: None
