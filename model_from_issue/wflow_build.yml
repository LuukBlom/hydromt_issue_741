steps:
  - setup_config:                 # options parsed to wflow toml file <section>.<option>
      data:
        time.starttime: 2010-01-01T00:00:00
        time.endtime: 2010-03-31T00:00:00
        time.timestepsecs: 86400
        input.path_forcing: inmaps-era5-2010.nc

  - setup_basemaps:
      hydrography_fn: merit_hydro   # source hydrography data {merit_hydro, merit_hydro_1k}
      basin_index_fn: merit_hydro_index # source of basin index corresponding to hydrography_fn
      upscale_method: ihu           # upscaling method for flow direction data, by default 'ihu'
      res: 0.00833           # build the model at a 30 arc sec (~1km) resolution
      region: # model region
        subbasin: [2.81249999983373, 45.9708333333023] # [placeholder] derive a subbasin with its outlet at the given x,y coordinates 
        strord: 4 # snapped to a river with minimum stream order (strord) of 4
        bounds: [2.35916666666669, 45.56, 3.02083333333333, 46.145] # [placeholder] within the given bounds [xmin, ymin, xmax, ymax] (WGS84)

  - setup_rivers:
      hydrography_fn: merit_hydro      # source hydrography data, should correspond to hydrography_fn in setup_basemaps
      #river_geom_fn: hydro_rivers_lin # river source data with river width and bankfull discharge
      river_upa: 4               # minimum upstream area threshold for the river map [km2]
      rivdph_method: powlaw           # method to estimate depth {'powlaw', 'manning', 'gvf'}
      min_rivdph: 1                # minimum river depth [m]
      min_rivwth: 30               # minimum river width [m]
      slope_len: 2000             # length over which tp calculate river slope [m]
      smooth_len: 5000             # length over which to smooth river depth and river width [m]
      river_routing: kinematic_wave   # {'kinematic_wave', 'local_inertial'}

  - setup_riverwidth:
      precip_fn: chelsa        # source for precip climatology used to estimate discharge: {chelsa}
      climate_fn: koppen_geiger # source for climate classification used to estimate discharge: {koppen_geiger}
      predictor: discharge     # predictor used in power-law w=a*predictor^b {'discharge'; 'uparea', other staticmaps}; a and b can also be set here.
      fill: false         # if False all river width values are set based on predictor, if True only data gaps and lakes/reservoirs in observed width are filled (works only with MERIT hydro)
      min_wth: 1             # global minimum width

  - setup_river_roughness:

#   - setup_floodplains: # if 1D floodplains are required
#       hydrography_fn: merit_hydro      # source hydrography data, should correspond to hydrography_fn in setup_basemaps
#       floodplain_type: 1d    # If one-dimensional floodplains are required
#       flood_depths: # flood depths at which a volume is derived
#         - 0.5
#         - 1.0
#         - 1.5
#         - 2.0
#         - 2.5
#         - 3.0
#         - 4.0
#         - 5.0

  - setup_reservoirs_simple_control:
      reservoirs_fn: hydro_reservoirs  # source for reservoirs shape and attributes
      timeseries_fn: gww           # additional source for reservoir are timeseries to compute reservoirs, Either 'gww' using gwwapi or 'jrc' using hydroengine.
      min_area: 1           # minimum lake area to consider [km2]
      predicate: "intersects"

  - setup_reservoirs_no_control:
      reservoirs_fn: hydro_lakes   # source for uncontrolled reservoirs (e.g. lakes) based on hydroLAKES: {hydro_lakes}
      min_area: 1          # minimum reservoir area to consider [km2]

  - setup_glaciers:
      glaciers_fn: rgi           # source for glaciers based on Randolph Glacier Inventory {rgi}
      min_area: 0.1           # minimum glacier area to consider [km2]

  - setup_lulcmaps:
      lulc_fn: vito_2018      # source for lulc maps: {globcover, vito, corine}
      lulc_mapping_fn: vito_mapping_default  # default mapping for lulc classes

  - setup_laimaps:
      lai_fn: modis_lai     # source for Leaf Area Index: {modis_lai}

  - setup_soilmaps:
      soil_fn: soilgrids     # source for soilmaps: {soilgrids}
      ptf_ksatver: brakensiek    # pedotransfer function to calculate hydraulic conductivity: {brakensiek, cosby}

  - setup_outlets:
      river_only: true

  - setup_gauges:
      gauges_fn: grdc          # if not None add gaugemap. Either a path or known gauges_fn: {grdc}
      # snap_to_river: True          # if True snaps gauges from source to river
      snap_uparea: true          # if True snaps gauges from source to river based on upstream area
      derive_subcatch: false         # if True derive subcatch map based on gauges.

  - setup_constant_pars:
      "snowpack__degree_day_coefficient": 3.75653
      "soil_surface_water__infiltration_reduction_parameter": 0.038
      "vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio": 0.11
      "compacted_soil_surface_water__infiltration_capacity": 10
      "soil_water_saturated_zone_bottom__max_leakage_volume_flux": 0
      "soil_wet_root__sigmoid_function_shape_parameter": -500
      "atmosphere_air__snowfall_temperature_threshold": 0
      "atmosphere_air__snowfall_temperature_interval": 2
      "snowpack__melting_temperature_threshold": 0
      "snowpack__liquid_water_holding_capacity": 0.1
      "glacier_ice__degree_day_coefficient": 3
      "glacier_firn_accumulation__snowpack_dry_snow_leq_depth_fraction": 0.001
      "glacier_ice__melting_temperature_threshold": 0

  - setup_ksathorfrac:
      ksat_fn: ksathorfrac
      variable: RF_250

  # Setup reservoir timeseries outputs  
  - setup_config_output_timeseries:
      mapname: "reservoir_outlet_id"
      header:
        - "outflow"
        - "inflow"
        - "volume"
        - "P"
        - "Epot"
        - "Eact"
        - "demand"
        - "maxrelease"
        - "targetf"
        - "targetm"
      param:
        - "reservoir_water__outgoing_volume_flow_rate"
        - "reservoir_water__incoming_volume_flow_rate"
        - "reservoir_water__volume"
        - "reservoir_water__precipitation_volume_flux"
        - "reservoir_water__potential_evaporation_volume_flux"
        - "reservoir_water__evaporation_volume_flux"
        - "reservoir_water_demand__required_downstream_volume_flow_rate"
        - "reservoir_water_release_below_spillway__max_volume_flow_rate"
        - "reservoir_water__target_full_volume_fraction"
        - "reservoir_water__target_min_volume_fraction"

  # Setup forcing timeseries outputs
  - setup_config_output_timeseries:
      mapname: "subcatchment"
      header:
        - "precip_subcatch"
        - "pet_subcatch"
        - "etact_subcatch"
        - "snow_subcatch"
        - "temp_subcatch"
      param:
        - "atmosphere_water__precipitation_volume_flux"
        - "land_surface_water__potential_evaporation_volume_flux"
        - "land_surface__evapotranspiration_volume_flux"
        - "snowpack_dry_snow__leq_depth"
        - "atmosphere_air__temperature"
      reducer:
        - "mean"
        - "mean"
        - "mean"
        - "mean"
        - "mean"
