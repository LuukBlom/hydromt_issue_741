[workspace]
authors = ["LuukBlom <Luuk.Blom@deltares.nl>"]
channels = ["conda-forge"]
name = "hydromt_issue_741"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
clean-build = "rm -rf ./.build"
build = { cmd = "hydromt build wflow_sbm ./.build -i ./config/wflow_build.yml -d ./config/deltares_data.yml -d ./config/deltares_data_ksathorfrac.yml -vvv", depends-on = ["clean-build"] }
copy-build = { cmd = "cp -r ./.build ./.updated" }
update = { cmd = "hydromt update wflow_sbm ./.updated -i ./config/wflow_update_forcing.yml -d ./config/deltares_data.yml -vvv", depends-on = ["copy-build"] }
full-reproduce = { depends-on = ["build", "update"] }

# Default dev environment (latest hydromt + hydromt_wflow)
[feature.dev.dependencies]
python = "3.13.*"
pytest = "*"
netcdf4 = "*"
h5py = "*"

[feature.dev.pypi-dependencies]
# hydromt = { path = "../hydromt/hydromt", extras = ["io"] }
hydromt = { git = "https://github.com/Deltares/hydromt.git" }
hydromt_wflow = {git = "https://github.com/Deltares/hydromt_wflow.git", extras=["extra"] }

# Environment reproducing the reporter's broken cluster setup exactly
# Usage: pixi run -e reproduce update
[feature.reproduce.dependencies]
python = ">=3.13"
numpy = "==2.3.5"
hydromt = "==1.3.0"
hydromt_wflow = "==1.0.1"
xarray = "==2026.2.0"
dask = "==2026.1.2"
distributed = "==2026.1.2"

[environments]
default = { features = ["dev"], solve-group = "default" }
reproduce = { features = ["reproduce"], solve-group = "reproduce" }
